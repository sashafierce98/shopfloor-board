<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .setup-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00a878 0%, #006d52 100%);
      padding: 24px;
    }

    .setup-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
    }

    .setup-card h2 {
      margin: 0 0 8px;
      background: none;
      padding: 0;
      color: #00a878;
      font-size: 1.8rem;
      text-align: center;
      font-weight: 700;
    }

    .setup-subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00a878;
      box-shadow: 0 0 0 3px rgba(0, 168, 120, 0.1);
    }

    .form-note {
      font-size: 0.8rem;
      color: #999;
      margin-top: 4px;
    }

    .setup-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00a878 0%, #006d52 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .setup-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 168, 120, 0.3);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #00a878;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-link a:hover {
      color: #006d52;
    }

    .error, .info {
      margin: -16px -16px 20px -16px !important;
      border-radius: 8px 8px 0 0;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #00a878 0%, #006d52 100%);">
  <div class="setup-container">
    <div class="setup-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <p class="{{ category }}">{{ msg }}</p>
        {% endfor %}
      {% endwith %}
      
      <div style="text-align: center; margin-bottom: 16px;">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="TGP Bioplastics Logo" style="height: 60px; object-fit: contain;">
      </div>
      <h2>TGP Bioplastics</h2>
      <p class="setup-subtitle">Create Supervisor Account</p>

      <form method="post">
        <div class="form-group">
          <label for="token">Setup Token</label>
          <input id="token" name="token" type="password" placeholder="Enter setup token" required>
          <p class="form-note">Contact your system administrator for the setup token</p>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="setup-button">Create Account</button>
      </form>

      <div class="back-link">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
